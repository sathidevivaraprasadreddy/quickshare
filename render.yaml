services:
  - type: web
    name: quickshare-api
    env: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: STORAGE_DRIVER
        value: local
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
